name: Deploy stlite to GitHub Pages

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build_stlite.py vendors pdfplumber's pure-Python source directly into
      # the stlite file map (see VENDOR_PACKAGES/_collect_vendored_packages in
      # deploy/build_stlite.py), so pdfplumber must be importable at BUILD
      # time, not just runtime-in-browser. The version here must stay in
      # lockstep with VENDORED_PDFPLUMBER_VERSION in deploy/build_stlite.py --
      # bump both together or the build's version guard will fail.
      - name: Install build-time dependencies
        run: pip install "pdfplumber==0.11.9"

      - name: Build stlite bundle
        run: python deploy/build_stlite.py --out-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
